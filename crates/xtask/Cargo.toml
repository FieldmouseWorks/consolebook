[package]
name = "xtask"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The repository's own tools: `cargo xtask proof` runs the gate sequence and leaves a receipt, `cargo xtask drill` is the restore drill's HTTP side"

[dependencies]
getrandom = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }
rustix = { version = "1", features = ["fs", "process", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
# The drill talks plain HTTP to servers on loopback: no TLS, no compression.
ureq = { version = "3", default-features = false }
# Exports are stored, never deflated, as the server writes them.
zip = { version = "9.0.3", default-features = false }

[dev-dependencies]
# The drill's tests run it against a live server on a loopback port.
consolebook-server = { path = "../consolebook-server" }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }

[lints]
workspace = true
