# The house rules CI can hold a PR to (its title, Rust by default, timers,
# file size, model names), through burrow's house action, pinned to a commit
# of burrow's main. Each rule is a commit status of its own, `house/RULE (#N)`.
name: house
on:
  pull_request:
    # edited too: the check reads the PR's title and body, so fixing either
    # runs it again.
    types: [opened, edited, reopened, synchronize]
jobs:
  house:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: FieldmouseWorks/burrow/.github/actions/house@4e2a4d8fecf20ee66b14fbdabd1aec207d10fd71 # main
        with:
          file-size-allow: |
            web/src/routes/drafts/[id]/+page.svelte # pre-existing large Svelte page component
            web/src/routes/enrollments/[id]/+page.svelte # pre-existing large Svelte page component
