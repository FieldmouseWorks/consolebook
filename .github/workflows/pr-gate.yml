name: pr-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The hermetic part of the gate (rustfmt, clippy, the Rust tests without
# embedded web assets, the proof runner's among them, the guidance guard) runs
# in the flake job (flake.yml, `nix flake check`). This job keeps what the
# flake can't hold: the web build, the Rust tests against the embedded
# interface, and the browser suite. Its name is a required check in the `main`
# ruleset, so it stays even though fmt and clippy moved to the flake.
jobs:
  gate:
    name: fmt-clippy-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-gate-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: pr-gate-npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The web app builds first so the Rust build embeds real interface
      # assets and the asset-serving tests exercise the strict branch.
      - name: Web install
        run: npm ci
        working-directory: web
      - name: Web check
        run: npm run check
        working-directory: web
      - name: Web build
        run: npm run build
        working-directory: web
      - name: Test
        run: cargo test --workspace
      # Playwright starts the binary itself, using invented scratch installations.
      - name: Build browser-test binary
        run: cargo build -p consolebook-server
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests
        run: npm run e2e
        working-directory: web
