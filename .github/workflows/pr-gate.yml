name: pr-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: fmt-clippy-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cheap repository guards run first so they fail in seconds.
      - name: Guidance names
        run: scripts/check-guidance-names.sh
      # The local gate runner's own controls (parsing, browser-suite evidence,
      # candidate hashing, interruption); a broken runner must not merge.
      - name: Proof runner self-test
        run: python3 scripts/proof.py --self-test
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-gate-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: pr-gate-npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The web app builds first so the Rust build embeds real interface
      # assets and the asset-serving tests exercise the strict branch.
      - name: Web install
        run: npm ci
        working-directory: web
      - name: Web check
        run: npm run check
        working-directory: web
      - name: Web build
        run: npm run build
        working-directory: web
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Playwright starts the binary itself, using invented scratch installations.
      - name: Build browser-test binary
        run: cargo build -p consolebook-server
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests
        run: npm run e2e
        working-directory: web
