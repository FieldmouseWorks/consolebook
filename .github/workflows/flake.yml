# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (the web build, browsers, the
# installer replays) stay in pr-gate.yml and release.yml. The shared workflow
# and the Nix install action it uses are allowlisted, and like every `uses:`
# here it is pinned to a commit (burrow main, 2026-10-24).
#
# A push to a conary/train/ branch is a merge-train candidate: main with the
# PRs it would land on top. conaryd counts the gate only as an attestation of
# the tree that lands, so the gate runs on each candidate and attests it.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main, "conary/train/**"]
permissions:
  contents: read
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@5fe4bb5868149b51bdb3cf2a555eb297ab41951a # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      install-nix: true
