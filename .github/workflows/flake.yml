# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (the web build, browsers, the
# installer replays) stay in pr-gate.yml and release.yml. The shared workflow
# and the Nix install action it uses are allowlisted, and like every `uses:`
# here it is pinned to a commit (burrow main, 2026-10-24).
name: flake
on:
  # `edited` for a PR retargeted onto another branch: the shared workflow's
  # run counts only for the base it judged, so a new base needs a run.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # Of the edits, only a new base: a title or body changes nothing checked.
    if: github.event.action != 'edited' || github.event.changes.base
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@21174eaf96a3d89a514d5869ba65cab8a30e4e76 # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      install-nix: true
