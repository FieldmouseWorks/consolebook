# Dependency version updates. Holds are written down here with their reason;
# remove an ignore rule when its reason no longer applies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Supply-chain caution: do not adopt a release on the day it is published.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 has no JS API, svelte-check peers `^5 || ^6`, and the
      # TypeScript 7 announcement says Svelte projects should stay on 6.
      # Revisit when svelte-check supports 7 (hold recorded in #140).
      - dependency-name: typescript
        versions: [">=7"]
      # Tracks the Node 22 floor in web/package.json `engines`.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(rust)
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # Dependabot keeps the full-SHA pins and their `# vX.Y.Z` comments.
    groups:
      actions:
        patterns:
          - "*"
